# Pacman configuration used by mkarchiso when building the Aspartame image.
#
# Identical to the build root's configuration apart from the [aspartame]
# repository, which is listed first so its rebuilt sugar-toolkit-gtk3 is
# preferred over the stock package. That rebuild carries
# patches/system/0001-sugar-toolkit-gtk3-keygrabber-release.patch; without it
# the classic Space never releases F1-F8 and the modern Space receives no
# function keys.
#
# scripts/build-sugar-toolkit-package.sh populates the repository.

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Locally built, unsigned, and intentionally ahead of [extra].
[aspartame]
SigLevel = Optional TrustAll
Server = file:///mnt/aspartame-artifacts/repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
